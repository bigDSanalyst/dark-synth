name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update && sudo apt-get install -y coq
      - run: pip install pyyaml pytest cryptography
      - run: python -m pytest tests/ -v
      - run: python tools/tag_lint.py
      - run: python tools/mutation_test.py
      - run: python tools/doctor.py
        continue-on-error: true

      - name: Lean 4 kernel check
        if: hashFiles('vault/catalytic_barrier/lean/lakefile.lean') != ''
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          source ~/.profile
          cd vault/catalytic_barrier/lean
          lake exe cache get
          lake build
          if grep -rn "sorry\|native_decide" AdversaryRing.lean; then
            echo "::error::forbidden token in Lean proof"
            exit 1
          fi
